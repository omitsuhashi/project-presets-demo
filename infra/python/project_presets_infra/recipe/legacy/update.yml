name: Update AWS infrastructure
on:
  schedule:
    - cron: '45 2 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  id-token: write
concurrency:
  group: aws-infrastructure
  cancel-in-progress: false
jobs:
  infrastructure:
    uses: omitsuhashi/project-presets-demo/.github/workflows/infra-consumer.yml@infra-tools/v1
    with:
      mode: update
