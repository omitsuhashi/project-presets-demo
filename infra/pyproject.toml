[project]
name = "project-presets-infra"
version = "2.0.0"
description = "Initial AWS recipe scaffolding using shared Terraform modules"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
project-presets-infra = "project_presets_infra:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "python"
module-name = "project_presets_infra"
