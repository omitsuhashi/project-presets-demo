name: Build and publish GitHub release packages

on:
  push:
    tags: ['typescript-v*', 'python-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.7'
      - name: Verify tag and package versions
        id: package
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import json, os, re, tomllib
          match = re.fullmatch(r"(typescript|python)-v([0-9]+\.[0-9]+\.[0-9]+)", os.environ["GITHUB_REF_NAME"])
          assert match, "Use typescript-vX.Y.Z or python-vX.Y.Z"
          language, version = match.groups()
          declared = (json.load(open("package.json"))["version"] if language == "typescript"
                      else tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          assert version == declared, "Tag and selected package version differ"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"language={language}\n")
          PY
      - run: npx --yes --ignore-scripts --package=pnpm@11.28.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - run: uv lock --check
      - run: node node_modules/pnpm/bin/pnpm.mjs run lint
      - run: node node_modules/pnpm/bin/pnpm.mjs run demo:ts
      - run: node node_modules/pnpm/bin/pnpm.mjs run demo:py
      - run: uv run --locked ruff check --config python/base.toml python/project_presets_demo scripts/check-packages.py scripts/update-consumer.py scripts/check-release-routing.py
      - run: node node_modules/pnpm/bin/pnpm.mjs test
      - name: Build selected package
        env:
          PRESET_LANGUAGE: ${{ steps.package.outputs.language }}
        run: |
          if [ "$PRESET_LANGUAGE" = typescript ]; then
            node node_modules/pnpm/bin/pnpm.mjs pack --config.ignore-scripts=true --pack-destination dist
          else
            uv build --out-dir dist
          fi
          cd dist
          sha256sum -- ./* > SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
