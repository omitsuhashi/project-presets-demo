name: Build and publish GitHub release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.7'
      - name: Verify publication tag and template inputs
        env:
          PUBLICATION_TAG: ${{ github.ref_name }}
        run: uv run --no-project --python 3.12 python scripts/release_presets.py check --tag "$PUBLICATION_TAG"
      - run: npx --yes --ignore-scripts --package=pnpm@11.28.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - run: uv lock --check
      - run: node node_modules/pnpm/bin/pnpm.mjs run lint
      - run: node node_modules/pnpm/bin/pnpm.mjs run demo:ts
      - run: node node_modules/pnpm/bin/pnpm.mjs run demo:py
      - run: uv run --locked ruff check --config python/base.toml python/project_presets_demo scripts tests
      - run: node node_modules/pnpm/bin/pnpm.mjs test
      - name: Build changed templates and complete index
        run: |
          uv run --no-project --python 3.12 python scripts/release_presets.py build --directory dist
          cd dist
          sha256sum -- ./* > SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
