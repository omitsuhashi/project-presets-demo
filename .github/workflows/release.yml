name: Build and publish GitHub release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.7'
      - name: Verify tag and package versions
        run: |
          uv run --no-project --python 3.12 python -c 'import json,os,re,tomllib; p=json.load(open("package.json")); t=tomllib.load(open("pyproject.toml","rb")); v=p["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",v); assert os.environ["GITHUB_REF_NAME"] == "v"+v == "v"+t["project"]["version"]'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run demo:ts
      - run: npm run demo:py
      - run: uvx --from ruff==0.16.10 ruff check --config python/base.toml python/project_presets_demo scripts/check-packages.py scripts/update-consumer.py
      - run: npm test
      - name: Build npm tarball and Python distributions
        run: |
          uv build --out-dir dist
          npm pack --ignore-scripts --pack-destination dist
          cd dist
          sha256sum -- ./*.tgz ./*.whl ./*.tar.gz > SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
