name: Check AWS infrastructure without credentials

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.7'
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - run: uvx --from ruff==0.16.10 ruff check --config python/base.toml infra/python/project_presets_infra infra/check.py
      - run: terraform fmt -check -recursive infra/modules
      - name: Validate native schemas and mock plans without AWS
        run: |
          for module in infra/modules/*; do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
            terraform -chdir="$module" test
          done
      - name: Check wheel, consumer ownership, v1 migration, bootstrap and both containers
        run: uv run --project infra python infra/check.py --containers
