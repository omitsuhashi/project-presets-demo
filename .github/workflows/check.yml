name: Check presets and update demo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.7'
      - run: npx --yes --ignore-scripts --package=pnpm@11.28.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - run: uv lock --check
      - run: node node_modules/pnpm/bin/pnpm.mjs run lint
      - run: node node_modules/pnpm/bin/pnpm.mjs run demo:ts
      - run: node node_modules/pnpm/bin/pnpm.mjs run demo:py
      - run: uv run --locked ruff check --config python/base.toml python/project_presets_demo scripts/check-packages.py scripts/update-consumer.py
      - run: node node_modules/pnpm/bin/pnpm.mjs test
